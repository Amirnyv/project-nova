<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Project Nova</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>


<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <h1>Project Nova</h1>

            <p class="auth-subtitle">
                Create your Nova account.
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="auth-message">

                        {% for message in messages %}

                            <p>{{ message }}</p>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    required
                    autocomplete="username"
                >


                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                >


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >


                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >


                <button
                    class="auth-button"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Log In
                </a>

            </p>

        </div>

    </div>

</body>

</html>
